<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Dalla tesi ai rigori</title>
<meta name="description" content="Tira i rigori contro Dello (col gesso!): segna 10 di fila o incassa quando vuoi.">
<meta property="og:title" content="Dalla tesi ai rigori">
<meta property="og:description" content="Tira i rigori contro Dello (col gesso!): segna 10 di fila o incassa quando vuoi.">
<meta name="theme-color" content="#070d1a">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚽</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#070d1a; --panel:#0e1830; --card:#111d38; --line:#22325a; --txt:#eef3ff; --mut:#8fa2c8;
  --acc:#c6ff3d; --acc2:#9be000; --gold:#ffcf3f; --red:#ff4d5e;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:radial-gradient(120% 60% at 50% 0%,#12224a 0%,var(--bg) 60%);color:var(--txt);
  font-family:'Barlow Condensed',system-ui,sans-serif;overscroll-behavior:none;touch-action:manipulation;
  -webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
#app{min-height:100dvh;display:flex;flex-direction:column;max-width:520px;margin:0 auto;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
header{display:flex;align-items:center;justify-content:space-between;padding:8px 12px 4px;gap:8px}
.logo{font-family:'Bebas Neue',Impact,sans-serif;font-size:27px;letter-spacing:1px;line-height:.9}
.logo span{color:var(--acc)}
.logo small{display:block;font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:11px;color:var(--mut);letter-spacing:2.5px;margin-top:3px}
.hr{display:flex;align-items:center;gap:8px}
.bal{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px 12px;text-align:right;min-width:112px;transition:transform .2s}
.bal small{display:block;font-size:10px;letter-spacing:2px;color:var(--mut);font-weight:600}
.bal b{font-size:22px;font-weight:800;line-height:1;white-space:nowrap}
.bal.up{transform:scale(1.08);border-color:var(--acc)} .bal.down{transform:scale(.96);border-color:var(--red)}
.mute{width:40px;height:40px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:18px}
.stage{flex:1;min-height:max(250px,44vh);display:flex;align-items:center;justify-content:center;padding:4px 10px}
canvas{display:block;border-radius:16px;box-shadow:0 12px 34px rgba(0,0,0,.5),0 0 0 1px rgba(255,255,255,.06)}
.ladder{flex-shrink:0;display:flex;gap:5px;padding:6px 10px 2px;overflow-x:auto;scrollbar-width:none}
.ladder::-webkit-scrollbar{display:none}
.step{flex:0 0 auto;min-width:58px;border:1px solid var(--line);border-radius:10px;padding:3px 6px 4px;text-align:center;background:var(--card);transition:all .25s}
.step i{display:block;font-style:normal;font-size:9px;color:var(--mut);letter-spacing:1px;font-weight:700}
.step b{display:block;font-size:15px;font-weight:800;line-height:1.05}
.step small{display:block;font-size:11px;color:var(--mut);font-weight:600}
.step.done{background:rgba(198,255,61,.14);border-color:var(--acc)} .step.done b{color:var(--acc)}
.step.next{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset} .step.next b{color:var(--gold)}
.step.top{background:linear-gradient(160deg,#3a2a00,#1a1405);border-color:#6b5310} .step.top b{color:var(--gold)}
#panel{padding:6px 10px 10px}
.strip{min-height:0;font-weight:700;font-size:15px;text-align:center;border-radius:10px;padding:0 10px;margin-bottom:0;transition:all .2s;overflow:hidden;max-height:0}
.strip.show{max-height:60px;padding:6px 10px;margin-bottom:6px}
.strip.win{background:rgba(255,207,63,.14);color:var(--gold)} .strip.lose{background:rgba(255,77,94,.13);color:#ff8a96}
.row{margin-bottom:7px}
.lbl{display:block;font-size:11px;letter-spacing:2px;color:var(--mut);font-weight:700;margin:0 0 4px 2px;text-transform:uppercase}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg button{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px 4px 5px;line-height:1.05}
.seg button b{display:block;font-size:18px;font-weight:800;letter-spacing:1px}
.seg button small{font-size:11px;color:var(--mut);font-weight:600}
.seg button.on{border-color:var(--acc);background:rgba(198,255,61,.1)} .seg button.on b{color:var(--acc)}
.seg button[data-m=hard].on{border-color:var(--red);background:rgba(255,77,94,.1)} .seg button[data-m=hard].on b{color:var(--red)}
.seg button[data-m=medium].on{border-color:var(--gold);background:rgba(255,207,63,.1)} .seg button[data-m=medium].on b{color:var(--gold)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:1px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px 11px 5px 6px;font-weight:700;font-size:15px;letter-spacing:.5px}
.chip .dot{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:800;color:#fff;border:2px solid rgba(255,255,255,.75)}
.chip.on{border-color:var(--acc);background:rgba(198,255,61,.1)}
.bets .chip{padding:7px 13px;font-size:16px}
.bets .chip.on{background:var(--acc);color:#11200a;border-color:var(--acc)}
.big{width:100%;height:54px;border-radius:14px;background:linear-gradient(180deg,#d6ff5c,#9fe000);color:#0d1a05;font-family:'Bebas Neue',Impact,sans-serif;font-size:27px;letter-spacing:1.5px;box-shadow:0 6px 0 #5f8a00,0 10px 22px rgba(160,230,0,.25);margin-top:2px;transition:transform .08s}
.big:active{transform:translateY(3px);box-shadow:0 3px 0 #5f8a00}
.big:disabled{background:#2a3550;color:#6d7da0;box-shadow:none}
.ghost{width:100%;margin-top:8px;height:42px;border-radius:12px;border:1px dashed var(--gold);color:var(--gold);font-weight:800;font-size:17px;letter-spacing:1px}
.info{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:8px}
.info div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:5px 8px;text-align:center}
.info small{display:block;font-size:10px;letter-spacing:1.5px;color:var(--mut);font-weight:700;text-transform:uppercase}
.info b{font-size:19px;font-weight:800}
.info .w b{color:var(--acc)} .info .n b{color:var(--gold)}
.ask{text-align:center;font-weight:700;font-size:13px;letter-spacing:2px;color:var(--mut);margin:0 0 5px;text-transform:uppercase}
.dirs{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.dirs button{height:64px;border-radius:14px;background:linear-gradient(180deg,#1b2b52,#13203f);border:1px solid #2d4277;box-shadow:0 5px 0 #0a1428;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:transform .08s}
.dirs button:active{transform:translateY(3px);box-shadow:0 2px 0 #0a1428}
.dirs button svg{width:26px;height:26px;stroke:var(--acc);stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
.dirs button span{font-family:'Bebas Neue',Impact,sans-serif;font-size:19px;letter-spacing:1.5px;margin-top:1px}
.dirs button:disabled{opacity:.4}
.cash{width:100%;height:54px;margin-top:10px;border-radius:14px;background:linear-gradient(180deg,#ffe07a,#f2b400);color:#2a1d00;font-family:'Bebas Neue',Impact,sans-serif;font-size:26px;letter-spacing:1.5px;box-shadow:0 6px 0 #9a7000,0 10px 24px rgba(255,200,0,.25);transition:transform .08s}
.cash:active{transform:translateY(3px);box-shadow:0 3px 0 #9a7000}
.cash:disabled{background:#2a3550;color:#6d7da0;box-shadow:none;font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:700;letter-spacing:.5px}
.cash.pulse:not(:disabled){animation:pulse 1.2s infinite}
@keyframes pulse{50%{box-shadow:0 6px 0 #9a7000,0 0 0 6px rgba(255,207,63,.18),0 10px 24px rgba(255,200,0,.35)}}
.hide{display:none!important}
.foot{text-align:center;font-size:11px;color:#5c6d92;margin-top:8px;letter-spacing:.5px}
@media (max-height:700px){
  .foot{display:none} .logo{font-size:22px} .logo small{display:none} .bal b{font-size:19px} .row{margin-bottom:5px}
  .chip{padding:4px 10px 4px 5px} .bets .chip{padding:6px 11px}
  .dirs button{height:54px} .big,.cash{height:48px;font-size:23px} .seg button b{font-size:16px}
  .ladder{padding-top:4px} .step{min-width:52px} .step small{display:none}
}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="logo">DALLA TESI<br><span>AI RIGORI</span><small>SEGNA 10 DI FILA · INCASSA QUANDO VUOI</small></div>
    <div class="hr">
      <div class="bal" id="balBox"><small>SALDO</small><b id="bal">100,00 €</b></div>
      <button class="mute" id="mute" aria-label="Audio">🔊</button>
    </div>
  </header>

  <div class="stage" id="stage"><canvas id="cv"></canvas></div>

  <div class="ladder" id="ladder"></div>

  <div id="panel">
    <div class="strip" id="strip"></div>

    <div id="setup">
      <div class="row"><span class="lbl">Modalità</span><div class="seg" id="modes"></div></div>
      <div class="row"><span class="lbl">Chi tira</span><div class="chips" id="shooters"></div></div>
      <div class="row"><span class="lbl">Puntata</span><div class="chips bets" id="bets"></div></div>
      <button class="big" id="play">GIOCA</button>
      <button class="ghost hide" id="refill">RICARICA 100 €</button>
      <div class="foot">Soldi finti, solo per divertimento · il portiere sceglie a caso a ogni tiro</div>
    </div>

    <div id="aim" class="hide">
      <div class="info">
        <div><small>Puntata</small><b id="iBet">—</b></div>
        <div class="w"><small>Vincita</small><b id="iWin">—</b></div>
        <div class="n"><small>Col prossimo gol</small><b id="iNext">—</b></div>
      </div>
      <div class="ask" id="ask">Dove tiri?</div>
      <div class="dirs">
        <button data-z="0"><svg viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></svg><span>SINISTRA</span></button>
        <button data-z="1"><svg viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></svg><span>CENTRO</span></button>
        <button data-z="2"><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg><span>DESTRA</span></button>
      </div>
      <button class="cash" id="cash">INCASSA</button>
    </div>
  </div>
</div>

<script>
(()=>{
'use strict';
/* ================== DATI ================== */
const SHOOTERS=[
  {name:'BAZOO',num:15, jersey:'#1f56d6',trim:'#ffffff',shorts:'#ffffff',socks:'#1f56d6',skin:'#e7b089',hair:'#2a1a12',style:'short'},
  {name:'TOMMY',num:10,jersey:'#d92a2a',trim:'#ffffff',shorts:'#151515',socks:'#d92a2a',skin:'#f2c7a1',hair:'#e6c25a',style:'flow'},
  {name:'SICCI',num:67, jersey:'#f6c915',trim:'#141414',shorts:'#141414',socks:'#f6c915',skin:'#c88b5e',hair:'#3a2316',style:'curly'},
  {name:'CINO', num:29,jersey:'#7b3be6',trim:'#ffffff',shorts:'#ffffff',socks:'#7b3be6',skin:'#a46d47',hair:'#0f0f0f',style:'buzz'},
];
const KEEPER={name:'DELLO',jersey:'#ff6a13',dark:'#c94a00',shorts:'#151515',socks:'#ff6a13',skin:'#e8b88e',hair:'#4a2b16',glove:'#e4ff3a'};
const MODES={
  soft:  {label:'SOFT',  p:0.80},
  medium:{label:'MEDIUM',p:2/3},
  hard:  {label:'HARD',  p:0.50},
};
const RTP=0.97, MAXGOALS=10;
const BETS=[10,20,30,40,100,200,300,500,1000]; // centesimi
function mult(mode,n){ if(n<=0) return 0; return Math.floor(RTP*Math.pow(1/MODES[mode].p,n)*100)/100; }

/* ================== UTILS ================== */
const TAU=Math.PI*2;
const lerp=(a,b,t)=>a+(b-a)*t;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const easeOut=p=>1-Math.pow(1-p,3);
const easeIn=p=>p*p;
const easeIO=p=>p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;
const lerpP=(a,b,t)=>[lerp(a[0],b[0],t),lerp(a[1],b[1],t)];
function rnd(){ try{const a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]/4294967296;}catch(e){return Math.random();} }
const R=(a,b)=>a+(b-a)*rnd();
const fmt=c=>(c/100).toLocaleString('it-IT',{minimumFractionDigits:2,maximumFractionDigits:2})+' €';
const fmtBet=c=>(c/100).toLocaleString('it-IT',{minimumFractionDigits:c%100?2:0,maximumFractionDigits:2})+' €';
const fmtX=m=>'x'+m.toLocaleString('it-IT',{minimumFractionDigits:2,maximumFractionDigits:2});
const $=id=>document.getElementById(id);
function vibrate(p){try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}}

/* ================== STATO ================== */
const st={bal:10000,mode:'medium',shooter:-1,bet:100,streak:0,state:'setup',shots:0};
const KEY='rigori-dello-v1';
try{const s=JSON.parse(localStorage.getItem(KEY)||'null'); if(s){ if(Number.isFinite(s.bal)) st.bal=Math.max(0,Math.floor(s.bal)); if(MODES[s.mode]) st.mode=s.mode; if(s.shooter>=-1&&s.shooter<4) st.shooter=s.shooter; if(BETS.includes(s.bet)) st.bet=s.bet; }}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify({bal:st.bal,mode:st.mode,shooter:st.shooter,bet:st.bet}))}catch(e){}}
function curShooter(){ return st.shooter<0 ? st.shots%4 : st.shooter; }

/* ================== AUDIO ================== */
let AC=null, muted=false, noiseBuf=null;
try{muted=localStorage.getItem(KEY+'-mute')==='1'}catch(e){}
function ac(){ if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){AC=null}} if(AC&&AC.state==='suspended'){AC.resume().catch(()=>{})} return AC; }
function env(g,t,a,d,v){g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v,t+a);g.gain.exponentialRampToValueAtTime(0.0001,t+a+d);}
function tone(f,dur,o={}){const a=ac();if(!a||muted)return;const t=a.currentTime+(o.delay||0);const os=a.createOscillator(),g=a.createGain();os.type=o.type||'sine';os.frequency.setValueAtTime(f,t);if(o.to)os.frequency.exponentialRampToValueAtTime(o.to,t+dur);env(g,t,.008,dur,o.vol||.15);os.connect(g).connect(a.destination);os.start(t);os.stop(t+dur+.05);}
function noise(dur,o={}){const a=ac();if(!a||muted)return;if(!noiseBuf){noiseBuf=a.createBuffer(1,a.sampleRate*2,a.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}
  const t=a.currentTime+(o.delay||0),at=o.attack||.02;const s=a.createBufferSource();s.buffer=noiseBuf;s.loop=true;const fl=a.createBiquadFilter();fl.type=o.type||'bandpass';fl.frequency.value=o.f||1000;fl.Q.value=o.q||1;const g=a.createGain();env(g,t,at,dur,o.vol||.15);s.connect(fl).connect(g).connect(a.destination);s.start(t);s.stop(t+at+dur+.05);}
const sfx={
  whistle(){const a=ac();if(!a||muted)return;const t=a.currentTime;const o=a.createOscillator();o.frequency.value=2850;const l=a.createOscillator();l.frequency.value=34;const lg=a.createGain();lg.gain.value=170;l.connect(lg).connect(o.frequency);const g=a.createGain();g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.09,t+.02);g.gain.setValueAtTime(.09,t+.3);g.gain.exponentialRampToValueAtTime(.0001,t+.38);o.connect(g).connect(a.destination);o.start(t);l.start(t);o.stop(t+.42);l.stop(t+.42);},
  kick(){tone(150,.14,{vol:.5,to:45});noise(.05,{vol:.22,f:1800,q:.7});},
  net(){noise(.3,{vol:.16,f:420,q:.8});},
  goal(){noise(2.3,{vol:.24,f:700,q:.55,attack:.22});noise(1.7,{vol:.09,f:2300,q:1,attack:.2});},
  save(){tone(95,.12,{vol:.4,to:60});noise(1.1,{vol:.15,f:360,q:.9,attack:.12});},
  post(){[523,1318,2093,3150].forEach((f,i)=>tone(f,1-i*.18,{vol:.16/(i+1)}));noise(1,{vol:.12,f:360,q:.9,attack:.15,delay:.1});},
  cash(){[660,880,1320].forEach((f,i)=>tone(f,.2,{vol:.13,type:'triangle',delay:i*.08}));},
  lose(){tone(330,.25,{vol:.1,type:'triangle',to:220});tone(220,.35,{vol:.1,type:'triangle',to:140,delay:.2});},
  click(){tone(900,.035,{vol:.04,type:'square'});},
  jackpot(){[523,659,784,1047,1319,1568,2093].forEach((f,i)=>tone(f,.25,{vol:.12,type:'triangle',delay:i*.09}));noise(2.8,{vol:.22,f:800,q:.5,attack:.3});},
};

/* ================== CANVAS ================== */
const W=400,H=440;
const cv=$('cv'), ctx=cv.getContext('2d'), stage=$('stage');
let S=1;
function resize(){
  const b=stage.getBoundingClientRect(); let w=b.width-20, h=b.height-8; const ar=W/H;
  if(w/h>ar) w=h*ar; else h=w/ar;
  w=Math.max(160,w); h=w/ar;
  cv.style.width=w+'px'; cv.style.height=h+'px';
  const dpr=Math.min(window.devicePixelRatio||1,3);
  cv.width=Math.round(w*dpr); cv.height=Math.round(h*dpr); S=cv.width/W;
}
window.addEventListener('resize',resize); window.addEventListener('orientationchange',()=>setTimeout(resize,200));

const GL={l:70,r:330,top:128,bot:236};
const BK={l:90,r:310,t:134,b:228};          // fondo della rete
const SPOT={x:200,y:368};
const ZONES=[{x:110,y:184},{x:200,y:178},{x:290,y:184}];
const SH_START={x:122,y:434,sc:1.02}, SH_KICK={x:170,y:392,sc:.93};
// timeline (ms)
const T_RUN=650, T_K=760, T_FL=430, T_I=T_K+T_FL, T_KS=T_K-60, T_DV=420, T_RES=2250, T_RESET=2700;

const scene={plan:null,t0:0,bulge:null,crowdT:-1e9,shake:null,banner:null,confetti:[],dust:[],press:-1,pressT:0};

/* ---- folla ---- */
const crowd=[];
(function(){const cols=['#e94b4b','#2f6fe0','#f2c84b','#f4f4f4','#8a5ae8','#ff8a3d','#36c99b','#ff5fa2','#3cc0ff'];const skins=['#f0c6a0','#d9a07a','#a8714b','#7a4a2e','#e7b48d'];
  for(let row=0;row<8;row++){const y=14+row*9.5;for(let x=2;x<W;x+=7+Math.random()*3.5){crowd.push({x:x+Math.random()*2,y:y+Math.random()*2.5,c:cols[(Math.random()*cols.length)|0],s:skins[(Math.random()*skins.length)|0],ph:Math.random()*TAU,r:2.7+row*.13});}}})();
const BOARD='  DALLA TESI AI RIGORI  •  BAZOO 15  •  TOMMY 10  •  SICCI 67  •  CINO 29  •  DELLO PARA ANCHE COL GESSO  •';

function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function seg(x1,y1,x2,y2,w,c){ctx.strokeStyle=c;ctx.lineWidth=w;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();}
function limb(a,b,bend,w1,c1,w2,c2){const mx=(a[0]+b[0])/2,my=(a[1]+b[1])/2,dx=b[0]-a[0],dy=b[1]-a[1],L=Math.hypot(dx,dy)||1;const kx=mx-dy/L*bend,ky=my+dx/L*bend;seg(a[0],a[1],kx,ky,w1,c1);seg(kx,ky,b[0],b[1],w2,c2);return[kx,ky];}
function circ(x,y,r,c){ctx.fillStyle=c;ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fill();}
function ell(x,y,rx,ry,c){ctx.fillStyle=c;ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,TAU);ctx.fill();}

function drawStands(now){
  const g=ctx.createLinearGradient(0,0,0,94);g.addColorStop(0,'#081022');g.addColorStop(1,'#18264a');ctx.fillStyle=g;ctx.fillRect(0,0,W,94);
  const age=now-scene.crowdT, jump=age<2600?Math.exp(-age/900):0;

function netDisp(px,py,now){const B=scene.bulge;if(!B)return[px,py];const age=now-B.t0;if(age>2000)return[px,py];

  const f=Math.pow(1-d/Rr,2);return[px+(d>0?dx/d:0)*amp*f*.6,py-amp*f*.9];}

function shade(hex,amt){const n=parseInt(hex.slice(1),16);let r=n>>16,g=(n>>8)&255,b=n&255;
  if(amt<0){r*=1+amt;g*=1+amt;b*=1+amt;}else{r+=(255-r)*amt;g+=(255-g)*amt;b+=(255-b)*amt;}return`rgb(${r|0},${g|0},${b|0})`;}
function capPath(a,b,w1,w2){const an=Math.atan2(b[1]-a[1],b[0]-a[0]);ctx.beginPath();ctx.arc(a[0],a[1],w1/2,an+Math.PI/2,an-Math.PI/2);ctx.arc(b[0],b[1],w2/2,an-Math.PI/2,an+Math.PI/2);ctx.closePath();}
function part(a,b,w1,w2,col){
  capPath(a,b,w1,w2);ctx.fillStyle=col;ctx.fill();
  ctx.save();ctx.clip();const dx=b[0]-a[0],dy=b[1]-a[1],L=Math.hypot(dx,dy)||1;let nx=-dy/L,ny=dx/L;if(nx+ny*.6<0){nx=-nx;ny=-ny;}
  capPath([a[0]+nx*w1*.5,a[1]+ny*w1*.5],[b[0]+nx*w2*.5,b[1]+ny*w2*.5],w1*.8,w2*.8);ctx.fillStyle='rgba(0,0,0,.2)';ctx.fill();
  capPath([a[0]-nx*w1*.3,a[1]-ny*w1*.3],[b[0]-nx*w2*.3,b[1]-ny*w2*.3],w1*.22,w2*.22);ctx.fillStyle='rgba(255,255,255,.16)';ctx.fill();ctx.restore();
  capPath(a,b,w1,w2);ctx.lineWidth=.55;ctx.strokeStyle='rgba(0,0,0,.28)';ctx.stroke();
}
function band(a,b,t,w,col,lw){const p=lerpP(a,b,t),dx=b[0]-a[0],dy=b[1]-a[1],L=Math.hypot(dx,dy)||1,nx=-dy/L*w/2,ny=dx/L*w/2;ctx.strokeStyle=col;ctx.lineWidth=lw||1.5;ctx.lineCap='butt';ctx.beginPath();ctx.moveTo(p[0]-nx,p[1]-ny);ctx.lineTo(p[0]+nx,p[1]+ny);ctx.stroke();}
function ik(a,b,l1,l2,sgn){const dx=b[0]-a[0],dy=b[1]-a[1];let d=Math.hypot(dx,dy)||.001;const mx=l1+l2-.02;let e=b;if(d>mx){e=[a[0]+dx/d*mx,a[1]+dy/d*mx];d=mx;}
  d=Math.max(d,Math.abs(l1-l2)+.02);const an=Math.atan2(dy,dx),A=Math.acos(clamp((l1*l1+d*d-l2*l2)/(2*l1*d),-1,1));
  return{k:[a[0]+Math.cos(an+sgn*A)*l1,a[1]+Math.sin(an+sgn*A)*l1],e};}

  return{x:lerp(Cc.x,Cc.x+P.hopDx,easeOut(p2)),y:Cc.y-s*32,rot:0,h,f:L2(KF.crouch,KF.tuck,s),face};
}

/* ================== LOGICA DEL TIRO ================== */
function makePlan(z,now){
  const kz=Math.floor(rnd()*3);          // il portiere sceglie completamente a caso
  const same=kz===z,dz=z-1,dk=kz-1;
  let res,variant='';
  if(st.mode==='soft'){ if(same){ if(rnd()<0.6) res='save'; else {res='goal';variant=z===1?'tunnel':'slip';} } else res='goal'; }
  else if(st.mode==='medium'){ res=same?'save':'goal'; }
  else { if(same) res='save'; else if(rnd()<0.25) res='wood'; else res='goal'; }

  const sideT=d=>({x:d<0?R(92,122):R(278,308),y:R(150,222)});
  const centT=()=>({x:R(182,218),y:R(150,212)});
  const kSideG=d=>({x:d<0?R(100,124):R(276,300),y:R(166,214)});
  const P={z,kz,shooter:curShooter(),C0:idlePos(now),curve:R(-10,10),lift:R(18,34),spin:rnd()<.5?-1:1,hopDx:R(-10,10)};
  let G=null;
  if(res==='save'){
    if(z===1){P.T={x:R(188,212),y:R(164,180)};P.km='catch-c';P.res='catch';G=P.T;}
    else{P.T=sideT(dz);P.km='dive';G=P.T;P.res=rnd()<.5?'catch':'parry';}
  }else if(res==='goal'){
    P.res='goal';P.goal=true;P.variant=variant;
    if(variant==='slip'){P.T={x:dz<0?R(82,88):R(312,318),y:R(138,146)};P.km='dive';G={x:P.T.x-dz*44,y:P.T.y+30};}
    else if(variant==='tunnel'){P.T={x:R(195,205),y:226};P.km='hop';P.hopDx=R(-3,3);}
    else{P.T=z===1?centT():sideT(dz);if(kz===1)P.km='hop';else{P.km='dive';G=kSideG(dk);}}
  }else{
    if(z===1){P.T={x:R(172,228),y:GL.top-2};P.res='bar';P.E={x:P.T.x+R(-20,20),y:58};}
    else{P.T={x:dz<0?GL.l-2:GL.r+2,y:R(150,222)};P.res='post';P.E={x:P.T.x+dz*72,y:P.T.y+R(105,130),r:8.5};}
    if(kz===1)P.km='hop';else{P.km='dive';G=kSideG(dk);}
  }
  if(P.km==='dive'){
    P.dir=G.x<200?-1:1;P.th=P.dir*(1.3+clamp((G.y-150)/72,0,1)*.25);
    P.C={x:G.x-HAND_REACH*Math.sin(P.th),y:G.y+HAND_REACH*Math.cos(P.th)};P.restY=Math.max(P.C.y,229);
  }else if(P.km==='catch-c'){P.C={x:G.x,y:G.y+10};}
  if(P.res==='parry'){P.E={x:clamp(P.T.x+P.dir*R(55,80),24,W-24),y:P.T.y+R(70,95),r:7.5};}
  P.Bn={x:lerp(BK.l,BK.r,(P.T.x-GL.l)/(GL.r-GL.l)),y:lerp(BK.t,BK.b,clamp((P.T.y-GL.top)/(GL.bot-GL.top),0,1))};
  return P;
}

function onImpact(P,now){
  const name=SHOOTERS[P.shooter].name;
  if(P.res==='goal'){
    sfx.net();sfx.goal();vibrate([30,40,60]);scene.bulge={x:P.Bn.x,y:P.Bn.y,t0:now};scene.crowdT=now;
    const next=st.streak+1;const sub=P.variant==='slip'?'Dello la sfiora!':P.variant==='tunnel'?'Tunnel a Dello!':`${name} non perdona · ${fmtX(mult(st.mode,next))}`;
    scene.banner={title:next>=MAXGOALS?'10 SU 10!':'GOOOL!',sub,col:'#c6ff3d',t0:now,dur:1500};
    if(next<MAXGOALS)burst(26);
  }else if(P.res==='catch'){sfx.save();vibrate(120);scene.banner={title:'PARATA!',sub:rnd()<.5?'Dello la blocca… col gesso!':'Dello la blocca',col:'#ff6a13',t0:now,dur:1500};}
  else if(P.res==='parry'){sfx.save();vibrate(120);scene.banner={title:'RESPINTA!',sub:'Dello vola e la respinge!',col:'#ff6a13',t0:now,dur:1500};}
  else if(P.res==='post'){sfx.post();vibrate([60,40,60]);scene.shake={t0:now,side:P.z-1};scene.banner={title:'PALO!',sub:'Che sfortuna…',col:'#ffffff',t0:now,dur:1500};}
  else{sfx.post();vibrate([60,40,60]);scene.shake={t0:now,side:0};scene.banner={title:'TRAVERSA!',sub:'Di un soffio',col:'#ffffff',t0:now,dur:1500};}
}

function finish(P){
  st.shots++;
  if(P.goal){
    st.streak++;
    if(st.streak>=MAXGOALS){cashout(true);return;}
    st.state='aim';
  }else{
    sfx.lose();
    showStrip(`Hai perso ${fmt(st.bet)}. Dello ti ha fermato al ${st.streak+1}° rigore.`,'lose');
    st.streak=0;st.state='setup';
  }
  updateUI();
}

function startGame(){
  if(st.state!=='setup')return;
  if(st.bal<st.bet)return;
  ac();sfx.click();
  st.bal-=st.bet;st.streak=0;st.state='aim';
  bumpBal('down');showStrip('');save();updateUI();
}
function shoot(z){
  if(st.state!=='aim')return;
  ac();const now=performance.now();
  scene.press=z;scene.pressT=now;
  st.state='anim';
  scene.plan=makePlan(z,now);scene.t0=now;scene.banner=null;scene.bulge=null;scene.shake=null;
  sfx.whistle();updateUI();
}
function cashout(jackpot){
  if(!(st.state==='aim'||jackpot)||st.streak<1)return;
  const m=mult(st.mode,st.streak),win=Math.floor(st.bet*m);
  st.bal+=win;bumpBal('up');
  const now=performance.now();
  if(jackpot){sfx.jackpot();burst(200,true);vibrate([80,60,80,60,200]);scene.banner={title:'JACKPOT!',sub:`+${fmt(win)}  (${fmtX(m)})`,col:'#ffcf3f',t0:now,dur:3200};
    showStrip(`🏆 10 rigori di fila! Hai vinto il premio massimo: ${fmt(win)}`,'win');}
  else{sfx.cash();burst(90,true);vibrate(60);scene.banner={title:'INCASSATO!',sub:`+${fmt(win)}  (${fmtX(m)})`,col:'#ffcf3f',t0:now,dur:2000};
    showStrip(`💰 Hai incassato ${fmt(win)} dopo ${st.streak} gol (${fmtX(m)})`,'win');}
  st.streak=0;st.state='setup';save();updateUI();
}

/* ================== UI ================== */
const modesEl=$('modes'),shEl=$('shooters'),betsEl=$('bets'),ladderEl=$('ladder');
function buildStatic(){
  modesEl.innerHTML=Object.keys(MODES).map(k=>`<button data-m="${k}"><b>${MODES[k].label}</b><small>gol ${Math.round(MODES[k].p*100)}%<br>max ${fmtX(mult(k,MAXGOALS))}</small></button>`).join('');
  shEl.innerHTML=`<button class="chip" data-s="-1"><span class="dot" style="background:conic-gradient(${SHOOTERS.map((s,i)=>`${s.jersey} ${i*25}% ${(i+1)*25}%`).join(',')})">↻</span>A TURNO</button>`+
    SHOOTERS.map((s,i)=>`<button class="chip" data-s="${i}"><span class="dot" style="background:${s.jersey};color:${s.trim}">${s.num}</span>${s.name}</button>`).join('');
  betsEl.innerHTML=BETS.map(c=>`<button class="chip" data-b="${c}">${fmtBet(c)}</button>`).join('');
  modesEl.onclick=e=>{const b=e.target.closest('button');if(!b||st.state!=='setup')return;st.mode=b.dataset.m;sfx.click();save();updateUI();};
  shEl.onclick=e=>{const b=e.target.closest('button');if(!b||st.state!=='setup')return;st.shooter=+b.dataset.s;sfx.click();save();updateUI();};
  betsEl.onclick=e=>{const b=e.target.closest('button');if(!b||st.state!=='setup')return;st.bet=+b.dataset.b;sfx.click();save();updateUI();};
  $('play').onclick=startGame;
  $('refill').onclick=()=>{st.bal=10000;bumpBal('up');sfx.cash();showStrip('Saldo ricaricato a 100,00 €','win');save();updateUI();};
  $('cash').onclick=()=>cashout(false);
  document.querySelectorAll('.dirs button').forEach(b=>b.onclick=()=>shoot(+b.dataset.z));
  $('mute').onclick=()=>{muted=!muted;try{localStorage.setItem(KEY+'-mute',muted?'1':'0')}catch(e){}updateUI();if(!muted){ac();sfx.click();}};
  cv.addEventListener('pointerdown',e=>{if(st.state!=='aim')return;const r=cv.getBoundingClientRect();const x=(e.clientX-r.left)/r.width*W;shoot(x<W/3?0:x>W*2/3?2:1);});
  window.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')shoot(0);else if(e.key==='ArrowUp')shoot(1);else if(e.key==='ArrowRight')shoot(2);else if(e.key===' '||e.key==='Enter'){e.preventDefault();if(st.state==='setup')startGame();else cashout(false);}});
}
let stripTimer=null;
function showStrip(msg,kind){const s=$('strip');clearTimeout(stripTimer);if(!msg){s.className='strip';return;}s.textContent=msg;s.className='strip show '+kind;stripTimer=setTimeout(()=>{s.className='strip';},6000);}
function bumpBal(k){const b=$('balBox');b.classList.remove('up','down');void b.offsetWidth;b.classList.add(k);setTimeout(()=>b.classList.remove(k),350);}
function updateUI(){
  $('bal').textContent=fmt(st.bal);
  $('mute').textContent=muted?'🔇':'🔊';
  const setup=st.state==='setup';
  $('setup').classList.toggle('hide',!setup);$('aim').classList.toggle('hide',setup);
  modesEl.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.m===st.mode));
  shEl.querySelectorAll('button').forEach(b=>b.classList.toggle('on',+b.dataset.s===st.shooter));
  betsEl.querySelectorAll('button').forEach(b=>b.classList.toggle('on',+b.dataset.b===st.bet));
  const play=$('play');
  if(st.bal<st.bet){play.disabled=true;play.textContent='SALDO INSUFFICIENTE';}else{play.disabled=false;play.textContent='GIOCA '+fmtBet(st.bet);}
  $('refill').classList.toggle('hide',st.bal>=10);
  // pannello tiro
  const anim=st.state==='anim';
  document.querySelectorAll('.dirs button').forEach(b=>b.disabled=anim);
  $('iBet').textContent=fmt(st.bet);
  $('iWin').textContent=st.streak?fmt(Math.floor(st.bet*mult(st.mode,st.streak))):'—';
  $('iNext').textContent=st.streak<MAXGOALS?fmt(Math.floor(st.bet*mult(st.mode,st.streak+1))):'—';
  $('ask').textContent=anim?'Tiro in corso…':`Rigore n° ${st.streak+1} di ${MAXGOALS} · dove tiri?`;
  const cash=$('cash');
  if(st.streak<1){cash.disabled=true;cash.textContent='Segna il primo rigore per poter incassare';cash.classList.remove('pulse');}
  else{cash.disabled=anim;cash.textContent='INCASSA '+fmt(Math.floor(st.bet*mult(st.mode,st.streak)));cash.classList.add('pulse');}
  // scala premi
  let html='';
  for(let i=1;i<=MAXGOALS;i++){const cls=[];if(!setup&&i<=st.streak)cls.push('done');if(!setup&&i===st.streak+1)cls.push('next');if(i===MAXGOALS)cls.push('top');
    html+=`<div class="step ${cls.join(' ')}" data-i="${i}"><i>${i===MAXGOALS?'🏆 10':i+'° GOL'}</i><b>${fmtX(mult(st.mode,i))}</b><small>${fmt(Math.floor(st.bet*mult(st.mode,i)))}</small></div>`;}
  ladderEl.innerHTML=html;
  const act=ladderEl.querySelector('.next')||ladderEl.querySelector('.step');
  if(act){const L=act.offsetLeft-ladderEl.clientWidth/2+act.clientWidth/2;ladderEl.scrollTo({left:Math.max(0,L),behavior:'smooth'});}
  requestAnimationFrame(resize);
}

/* ================== LOOP ================== */
function frame(now){
  const P=scene.plan;
  if(P){const t=now-scene.t0;
    if(!P.kicked&&t>=T_K){P.kicked=1;sfx.kick();}
    if(!P.hit&&t>=T_I){P.hit=1;onImpact(P,now);}
    if(!P.done&&t>=T_RES){P.done=1;finish(P);}
    if(t>T_RESET&&st.state!=='anim')scene.plan=null;
  }
  draw(now);
  requestAnimationFrame(frame);
}
buildStatic();updateUI();resize();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{});
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
